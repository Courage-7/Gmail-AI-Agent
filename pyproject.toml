[project]
name = "email-assistant-app"
version = "0.1.0"
description = "FastAPI email agent backed by Docker Gmail MCP, LangGraph, Groq, and Supabase memory"
readme = "README.md"
authors = [
    { name = "Courage-7", email = "siamehcourage@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "langchain-core>=1.4.0",
    "langgraph>=1.2.2",
    "mcp>=1.27.1",
    "pydantic-settings>=2.14.1",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "supabase>=2.30.1",
    "uvicorn[standard]>=0.48.0",
]

[project.scripts]
email-assistant-app = "email_assistant_app:main"

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s"
